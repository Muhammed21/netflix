services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: netflix
      POSTGRES_PASSWORD: netflix
      POSTGRES_DB: netflix
    ports:
      - "5432:5432"
    volumes:
      - netflix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflix -d netflix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netflix_pgdata:
