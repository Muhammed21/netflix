name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint check-types test
      # Le Swift de packages/design-tokens est généré mais versionné : Xcode lit
      # des fichiers réels. Ce gate échoue si le committé diverge des tokens.
      - run: pnpm --filter @repo/design-tokens tokens:check
      - run: pnpm audit --prod --audit-level=high
